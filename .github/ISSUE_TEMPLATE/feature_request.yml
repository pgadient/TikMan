name: Feature request
description: Suggest something TikMan should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The situation, not the solution. "I manage 40 switches across three sites and cannot tell which
        ones still run an old firmware" says more than "add a filter".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
      description: Optional — a rough idea is fine, and so is leaving this empty.

  - type: input
    id: vendor
    attributes:
      label: Which vendor or device does this concern?
      description: >
        Vendor support is added device by device. Naming the hardware makes it much likelier this can be
        built and tested rather than guessed at.
